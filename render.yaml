# Render blueprint — the deployment described in the repository rather than in a
# dashboard, so it can be reviewed, changed in a pull request and recreated.
#
# Apply with Blueprints → New Blueprint Instance.
#
# ── This is a migration, not a fresh start ───────────────────────────────────
#
# A native-Python service `projection-area-analyzer` already exists in this
# account, in Ohio, on 0.5 CPU / 512 MB, serving commit 82ad49f. It works for PDF
# and DXF and reports `dwg: false`, because a native Python build cannot install
# GNU LibreDWG.
#
# That service is the rollback and must keep running. So the name below is
# deliberately `-docker` and deliberately NOT a near-miss of the existing name:
# "projection-area-analyzer" and "projected-area-analyzer" differ by one word, and
# a blueprint that adopted the wrong one would replace the thing it is meant to
# fall back to. Nothing here can touch the existing service.
#
# Once the Docker service has been proven against the real drawings, renaming or
# retiring the old one is a separate, deliberate decision.
#
# See docs/DEPLOYMENT.md for the sizing evidence behind `plan`.

services:
  - type: web
    # Temporary name, alongside the existing service rather than over it.
    name: projection-area-analyzer-docker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    repo: https://github.com/hemeiling/ProjectionArea
    branch: main
    # Same region as the service being migrated from, so a comparison between the
    # two measures the runtime change and not the distance to Ohio.
    region: ohio

    # Docker, not the native Python runtime: reading a DWG needs GNU LibreDWG,
    # which no Debian suite packages, so the converter is built into the image.
    # The Dockerfile explains this at length.

    # Cheap, and it fails when the converter is missing rather than only when the
    # process is dead — a deployment that lost DWG support is the failure worth
    # catching, and it looks perfectly healthy from the outside otherwise.
    healthCheckPath: /health

    # ── plan: start small, then measure ─────────────────────────────────────
    #
    # Peak memory of a whole job — upload, convert, read, footprint candidates,
    # area — measured per production drawing on a freshly started server:
    #
    #     101 PDF  0.9 GB      103 DWG   6.7 GB
    #     102 PDF  2.6 GB      101 DWG   9.4 GB      102 DWG  11.7 GB
    #
    # This starts at 1c-2g (Standard, 2 GB) because the first question is whether
    # the *image* works: does it boot, does /health report dwg: true, does the
    # page load in both languages, does a PDF measure, does the progress bar move,
    # does export work. All of that fits in 2 GB, and standing up 16 GB to find
    # out the page renders would be a waste.
    #
    # 2 GB will NOT run a production DWG: the smallest needs 6.7 GB and the
    # process is killed part way through. `dwg: true` from /health proves the
    # converter is present in the image; proving a 97 MB drawing measures needs
    # 2c-16g, which is a dashboard plan change on this service once the smoke test
    # passes — no redeploy, and no reason to commit to that cost before then.
    #
    # Free and Starter (512 MB, which is what the existing service runs on) cannot
    # process any production drawing at all.
    plan: 1c-2g

    envVars:
      # Render sets PORT itself; the application reads it and binds 0.0.0.0.
      # Nothing else here is required — the service starts with no configuration
      # at all, which is deliberate.

      - key: PYTHONUNBUFFERED
        value: "1"

      # The ceiling on an upload, in megabytes. The default in the code is the
      # same 200; it is stated here so raising it is a reviewable change rather
      # than a dashboard edit nobody can see. Production DWGs reach 93 MB and
      # their converted DXFs about 120 MB.
      - key: MAX_UPLOAD_MB
        value: "200"

      # LIBREDWG_BIN is deliberately unset: the image puts dwg2dxf on PATH and
      # the application finds it there. The variable exists for a host that puts
      # it somewhere unusual, and is never required.

      # Persistence. DATABASE_URL must be the database's *internal* URL: the
      # service and the database are both on Render, so the connection never
      # leaves their network and no external address is exposed. Set it in the
      # dashboard (or with fromDatabase below if the database is in this
      # blueprint) — never as a literal in this file, because it carries a
      # password and this file is committed.
      #
      #   - key: DATABASE_URL
      #     fromDatabase:
      #       name: <the database's name in this blueprint>
      #       property: connectionString
      #
      # With DATABASE_URL absent the service still runs and simply saves nothing,
      # which /health reports as "database": false.
      - key: DATABASE_URL
        sync: false

      # Every object lives here and nothing outside it is ever touched. The
      # instance is shared with another application, so this is not a default to
      # be relied on — the application refuses to start persistence against
      # `public`.
      - key: DATABASE_SCHEMA
        value: projection_area

      # CLAUDE_API_KEY and GEMINI_API_KEY are optional and absent by default.
      # Nothing in the engine reads them — AI is for interpretation, never for
      # measurement — so the service must start without them, and does. Add them
      # as secrets in the dashboard if and when that changes; never in this file.

    # Drawings are proprietary and the filesystem is ephemeral by design: an
    # upload lives in a per-process temporary directory and is deleted when the
    # job finishes, the TTL expires or the process stops. No disk is attached,
    # and attaching one would mean customer drawings surviving a restart.
